name: Update market data

on:
  schedule:
    - cron: "15 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update local CSVs
        env:
          DATA_BACKEND: local
        run: |
          python main.py
          test "$(find data/raw -name '*.csv' | wc -l)" -gt 0
          test "$(find data/processed -name '*.csv' | wc -l)" -gt 0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Sync CSVs to private S3 bucket
        env:
          DATA_BUCKET: ${{ secrets.DATA_BUCKET }}
        run: |
          aws s3 sync data/raw "s3://$DATA_BUCKET/market-data/raw" --delete
          aws s3 sync data/processed "s3://$DATA_BUCKET/market-data/processed" --delete
