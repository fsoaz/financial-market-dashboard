[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "venv", "data", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.coverage.run]
source = ["src"]
omit = ["src/__init__.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
